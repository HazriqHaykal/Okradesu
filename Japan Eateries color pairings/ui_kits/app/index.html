<!-- @dsCard group="App" viewport="1240x880" name="Japan Eateries app" subtitle="Welcome → Home → Detail click-through" -->
<!doctype html><html><head><meta charset="utf-8"><title>Japan Eateries — App UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="Frame.jsx"></script>
<script type="text/babel" src="Welcome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Detail.jsx"></script>
</head>
<body style="margin:0;background:var(--orange-200);min-height:100vh;">
<div id="root"></div>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('je-kit-screen') || 'welcome');
  const [food, setFood] = React.useState(FOODS[1]);
  const [favs, setFavs] = React.useState(['udon']);
  const [tab, setTab] = React.useState('home');
  React.useEffect(() => { localStorage.setItem('je-kit-screen', screen); }, [screen]);
  const toggleFav = (id) => setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
  const Tab = ({ id, label }) => (
    <button onClick={() => setScreen(id)} style={{ border: 'none', cursor: 'pointer', padding: '8px 14px', borderRadius: 999, fontFamily: 'var(--font-body)', fontSize: 12, fontWeight: 700,
      background: screen === id ? 'var(--ink-900)' : 'var(--surface-card)', color: screen === id ? 'var(--white)' : 'var(--text-primary)' }}>{label}</button>
  );
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, padding: '28px 20px 40px' }}>
      <div style={{ display: 'flex', gap: 8 }}><Tab id="welcome" label="Welcome" /><Tab id="home" label="Home" /><Tab id="detail" label="Detail" /></div>
      {screen === 'welcome' && <Welcome onStart={() => setScreen('home')} />}
      {screen === 'home' && <Home favs={favs} toggleFav={toggleFav} tab={tab} setTab={setTab} onOpen={(x) => { setFood(x); setScreen('detail'); }} />}
      {screen === 'detail' && <Detail food={food} fav={favs.includes(food.id)} toggleFav={() => toggleFav(food.id)} onBack={() => setScreen('home')} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
